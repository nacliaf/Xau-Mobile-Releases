name: Verify published minimum app version

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-minimum-version:
    name: Verify backend minimum version
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out release repository
        uses: actions/checkout@v4

      - name: Ensure jq is available
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes jq
          fi

      - name: Wait for backend minimum version promotion
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
        run: bash scripts/verify-published-min-version.sh "$RELEASE_TAG"
